# drydock.yaml — Drydock deploy manifest. Replaces render.yaml.
# Drydock reads this to build, run, and provision your app. Edit here or in
# the portal (portal writes win on the next "Re-commit"). Secrets live in the
# portal (SSM), never in this file.
name: inloop
kind: ssr          # ssr | static
runtime: bun        # bun | node
port: 3995
size: m          # xs | s | m | l — memory reservation
build: bun run build
start: bun run start
database: true      # provision Postgres + DATABASE_URL
prisma: true        # prisma generate on build, db push predeploy
predeploy: bunx prisma db push
domains:
  - inloop.dested.com
dnsZone: dested.com
