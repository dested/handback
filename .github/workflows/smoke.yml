name: smoke

# Post-deploy and periodic liveness check against prod. This has no in-app
# alerting to lean on when the whole task is down — so the alert channel IS a
# failed GitHub Actions run: GitHub emails the repo owner when this job goes red.
# That is intentional; do not "fix" it by swallowing the failure.

on:
  # Runs after the deploy workflow (drydock.yml, name: deploy) finishes on main.
  workflow_run:
    workflows: ["deploy"]
    types: [completed]
    branches: [main]
  # Independent heartbeat: catches a task that fell over between deploys.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    # For the post-deploy trigger, only probe a deploy that actually succeeded —
    # a failed build never rolled anything out, so there is nothing new to check.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Probe handback.dev
        run: |
          # ECS is still rolling when the deploy workflow reports complete; give
          # the new task a head start before the first probe (post-deploy only).
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sleep 90
          fi

          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "== attempt $attempt =="
            ok=1

            curl -fsS --max-time 15 https://handback.dev/healthz | grep -q '"status":"ok"' \
              || { echo "healthz failed"; ok=0; }

            curl -fsS --max-time 15 https://handback.dev/ | grep -qi handback \
              || { echo "homepage failed"; ok=0; }

            # A GET on the MCP endpoint answers 405 when it is mounted; an HTML
            # page or a 404 means the SSR catch-all swallowed it (bad wiring).
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://handback.dev/mcp)
            [ "$code" = "405" ] || { echo "mcp returned $code, expected 405"; ok=0; }

            if [ "$ok" = "1" ]; then
              echo "all probes passed"
              exit 0
            fi

            attempt=$((attempt + 1))
            [ "$attempt" -le 3 ] && sleep 30
          done

          echo "smoke check failed after 3 attempts"
          exit 1
