# Generated by Drydock — deploys inloop on every push to main.
name: deploy
on:
  push:
    branches: [main, master]
concurrency: deploy-${{ github.ref }}
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::114394156384:role/drydock-github-deploy
          aws-region: us-west-2

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Container-driver builder — required for the type=gha build cache
      # (the default docker driver can't export/import caches).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/drydock/inloop:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/drydock/inloop:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Register new task definition revision
        run: |
          aws ecs describe-task-definition --task-definition drydock-inloop --query taskDefinition > taskdef.json
          jq --arg IMG "${{ steps.ecr.outputs.registry }}/drydock/inloop:${{ github.sha }}" \
            '.containerDefinitions[0].image = $IMG
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            taskdef.json > taskdef-new.json
          aws ecs register-task-definition --cli-input-json file://taskdef-new.json

      - name: Run pre-deploy command (migrations)
        run: |
          TASKDEF=$(aws ecs describe-task-definition --task-definition drydock-inloop --query taskDefinition.taskDefinitionArn --output text)
          TASK=$(aws ecs run-task --cluster drydock --task-definition "$TASKDEF" \
            --overrides '{"containerOverrides":[{"name":"app","command":["sh","-c","bunx prisma db push"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "migration task: $TASK"
          aws ecs wait tasks-stopped --cluster drydock --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster drydock --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT" != "0" ]; then echo "pre-deploy failed (exit $EXIT)"; exit 1; fi

      - name: Deploy
        run: |
          aws ecs update-service --cluster drydock --service drydock-inloop --task-definition drydock-inloop --desired-count 1 >/dev/null
          aws ecs wait services-stable --cluster drydock --services drydock-inloop
          echo "deployed ${{ github.sha }}"
