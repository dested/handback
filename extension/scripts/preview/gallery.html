<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <title>Handback — panel widths</title>
    <style>
      /* Harness chrome, held to the product's law: light paper, cobalt accent. */
      html, body { height: 100%; margin: 0; background: #f7f7f4; color: #6b6a63;
        font: 11px ui-monospace, SFMono-Regular, monospace; }
      .bar { display: flex; align-items: baseline; gap: 14px; padding: 10px 12px 0; }
      .bar b { color: #16181f; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
      .bar a { color: #6b6a63; text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 1px; }
      .bar a:hover { color: #16181f; }
      .bar a.on { color: #2f56d8; border-color: #2f56d8; }
      .row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px 16px; }
      .cell { display: flex; flex-direction: column; gap: 5px; }
      .cell > div { display: flex; justify-content: space-between; gap: 8px; }
      .cell em { color: #2f56d8; font-style: normal; }
      iframe { border: 1px solid #e2e0da; background: #fff; display: block; }
    </style>
  </head>
  <body>
    <div class="bar" id="bar"><b>handback panel</b></div>
    <div class="row" id="row"></div>
    <script>
      /**
       * One iframe per width token, so the panel's media queries see a real width.
       * A token is `W`, or `WxH` when a cell needs its own height — the panel is a
       * rail and has exactly one shape, so width is nearly always the whole story.
       */
      const q = new URLSearchParams(location.search);
      const tokens = (q.get('w') || '380,560,900').split(',').filter(Boolean);
      const mode = q.get('mode') || 'rec';
      const height = Number(q.get('h')) || Math.max(560, window.innerHeight - 70);

      // `home` and `home+unlinked` are the same screen with and without a workspace
      // key — the second is what a fresh install sees, and it has to hold up too.
      // `fresh` is a walkthrough seconds old: the empty timeline has to be one line.
      for (const m of [
        'rec',
        'long',
        'fresh',
        'home',
        'home+unlinked',
        'empty',
        'rec+ctx=none',
        'rec+ctx=fail',
      ]) {
        const a = document.createElement('a');
        a.textContent = m;
        a.href = `?w=${tokens.join(',')}&mode=${m}`;
        if (m === mode) a.className = 'on';
        document.getElementById('bar').append(a);
      }

      // `seed+flag` — a flag is either a bare switch (`unlinked`) or `key=value`
      // (`ctx=fail`), so the panel's awkward states are addressable from the bar.
      const [seed, flag] = mode.split('+');
      const query = `mode=${seed}${flag ? `&${flag.includes('=') ? flag : `${flag}=1`}` : ''}`;

      for (const token of tokens) {
        const [w, own] = String(token).split('x').map(Number);
        const cell = document.createElement('div');
        cell.className = 'cell';
        const title = document.createElement('div');
        const label = document.createElement('span');
        label.textContent = own ? `${w}×${own}` : `${w}px`;
        title.append(label);
        const frame = document.createElement('iframe');
        frame.src = `/preview.html?${query}&t=${Date.now()}`;
        frame.width = w;
        frame.height = own || height;
        cell.append(title, frame);
        document.getElementById('row').append(cell);
      }
    </script>
  </body>
</html>
